<!-- First thing in <head>: apply cached theme before paint -->
<meta name="theme-color" content="#F5F4EE">
<script>try{var p=JSON.parse(localStorage.getItem("sub.theme")||"{}"),d=p.mode==="dark"||(p.mode!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches),r=document.documentElement;
r.dataset.scheme=d?"dark":"light";if(p.light)r.dataset.lightTheme=p.light;if(p.dark)r.dataset.darkTheme=p.dark;}catch(e){}</script>
<link rel="stylesheet" href="/theme/themes.css">
